name: Build APK

on:
  push:
    branches: [ develop ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Install consistent debug keystore
        run: |
          mkdir -p ~/.android
          cp .github/signing/debug.keystore ~/.android/debug.keystore

      - name: Build freeDebug APK
        run: ./gradlew :app:assembleFreeDebug

      - name: Locate APK
        id: apk
        run: |
          APK=$(find app/build/outputs/apk -name '*.apk' | head -1)
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "name=$(basename $APK)" >> "$GITHUB_OUTPUT"

      - name: Publish nightly release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: Nightly Build
          body: "Auto-built from the latest commit on `develop`. Install via Obtainium."
          prerelease: true
          files: ${{ steps.apk.outputs.path }}
